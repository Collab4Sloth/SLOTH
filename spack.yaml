spack:
  specs:
    - mpich
    - hypre@3.1.0 +shared 
    - mfem@4.9.0 +mpi +suite-sparse +sundials +superlu-dist 
    - exprtk

  concretizer:
    unify: false

  config:
    build_jobs: 8

  packages:
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]

    mpi:
      require: mpich
      buildable: false

    openblas:
      buildable: false

    perl:
      buildable: false