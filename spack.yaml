spack:
  specs:
    - mpich
    - hypre@3.1.0 +shared 
    - mfem@4.9.0 +mpi +suite-sparse +sundials +superlu-dist
    - exprtk

  concretizer:
    unify: true

  config:
    build_jobs: 8
    
  compilers:
  - compiler:
      spec: gcc@14.2.0
      paths:
        cc: /usr/bin/gcc
        cxx: /usr/bin/g++
        f77: /usr/bin/gfortran
        fc: /usr/bin/gfortran
      flags: {}
      operating_system: ubuntu-latest
      target: x86_64
      modules: []
      environment: {}
      extra_rpaths: []

  packages:
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]

    mpi:
      require: mpich
      buildable: false

    openblas:
      buildable: false

    perl:
      buildable: false