spack:
  specs:
    - hypre@3.1.0 +shared %gcc@14
    - mfem@4.9.0 +mpi +suite-sparse +sundials +superlu-dist %gcc@14
    - exprtk

  concretizer:
    unify: true
   

  packages:
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]

    mpi:
      require: mpich

    openblas:
      buildable: true

    perl:
      buildable: false
    ncurses:
      buildable: false
    intel-oneapi-mkl:
      buildable: false
