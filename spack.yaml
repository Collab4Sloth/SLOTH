spack:
  specs:
    - mfem@4.9.0 +mpi +mumps +exceptions %gcc@14
    - catch2@3 %gcc@14

  concretizer:
    unify: true

  packages:
    c:
      require: [gcc@14]
    cxx:
      require: [gcc@14]
    fortran:
      require: [gcc@14]
    mpi:
      require: [openmpi]
      buildable: false
    openblas:
      buildable: false
    perl:
      buildable: false
    ncurses:
      buildable: false
    intel-oneapi-mkl:
      buildable: false
