spack:
  specs:
    - mpich %gcc@14
    - hypre@3.1.0 +shared %gcc@14
    - mfem@4.9.0 +mpi +suite-sparse +sundials +superlu-dist %gcc@14
    - exprtk

  concretizer:
    unify: true

  config:
    build_jobs: 8
    

  packages:
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]

    mpi:
      require: mpich
      buildable: false

    openblas:
      buildable: false

    perl:
      buildable: false