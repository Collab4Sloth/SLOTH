set noparent
linelength=100
# Filters of the whole project:
#   runtime/references, runtime/string, build/header_guard, build/include,
#   whitespace/indent_namespace: project conventions
#   readability/check: Google Test / glog macros (CHECK_EQ...), not those of Catch2
#   build/c++17: headers of C++17 (<filesystem>...) used by the project (C++20)
filter=-runtime/references,-runtime/string,-build/header_guard,-build/include
filter=-whitespace/indent_namespace,-readability/check,-build/c++17
