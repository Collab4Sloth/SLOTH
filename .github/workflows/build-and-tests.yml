name: Build and Test SLOTH on Linux and MacOS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
      
    strategy:
      matrix:
        os: [ubuntu-latest]
        # os: [ubuntu-22.04, ubuntu-24.04]
        # gcc_version: [11, 14]
        # exclude:
        #   - os: ubuntu-22.04
        #     gcc_version: 14  
        #   - os: ubuntu-24.04
        #     gcc_version: 11 
    steps:
    - uses: actions/checkout@v4

    - name: Set number of cores
      run: echo "CORES=$(nproc)" >> $GITHUB_ENV

    - name: Set up Spack
      uses: spack/setup-spack@v2
      with:
        ref: develop      # Spack version (examples: develop, releases/v0.21)
        buildcache: true  # Configure oci://ghcr.io/spack/github-actions-buildcache
        color: true       # Force color output (SPACK_COLOR=always)
        path: ${{ runner.temp }}/spack # where to clone spack

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y mpich libmpich-dev wget unzip libncurses-dev libboost-all-dev libopenblas-dev perl
    - name: Install MFEM
      shell: spack-bash {0}
      run: |
          spack compiler find 
          spack external find openmpi mpich openblas perl
          spack env activate .
          spack concretize -f

          spack install -j $CORES --fail-fast 
        
    - name: Setup Python 
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Python dependencies 
      run: python -m pip install --upgrade pip gcovr cpplint matplotlib pandas numpy scipy sympy vtk

    - name: Build SLOTH
      shell: spack-bash {0}    
      run: | 
        spack env activate .
        export PATH="$pythonLocation/bin:$PATH"

        mkdir -p ${{ github.workspace }}/build
        cd ${{ github.workspace }}/build
        bash ../envSloth.sh --coverage --np=$CORES
        make -j $CORES tests
        

    - name: Test SLOTH 
      shell: spack-bash {0}    
      run: | 
        spack env activate .
        export PATH="$pythonLocation/bin:$PATH"

        cd ${{ github.workspace }}/build
        find . -type d -name "Save*" -exec rm -rf {} +
        ctest -j $CORES --output-on-failure

    - name: Install SLOTH and build the minimal example (user procedure)
      shell: spack-bash {0}
      run: |
        spack env activate .
        export PATH="$pythonLocation/bin:$PATH"
        cd ${{ github.workspace }}/build
        cmake --install . --prefix ${{ github.workspace }}/sloth-installed
        cmake -S ${{ github.workspace }}/sloth-installed/share/sloth/examples/minimal \
              -B ${{ github.workspace }}/example-build \
              -DCMAKE_PREFIX_PATH=${{ github.workspace }}/sloth-installed
        cmake --build ${{ github.workspace }}/example-build
        cd ${{ github.workspace }}/example-build && ctest --output-on-failure

    - name: Install SLOTH with Spack and build the minimal example (spack procedure)
      shell: spack-bash {0}
      run: |
        spack env activate .
        spack repo add ${{ github.workspace }}/spack_repo
        spack external find python
        spack develop --no-clone --path ${{ github.workspace }} sloth@=master
        spack add sloth@=master
        spack concretize -f
        spack install -j $CORES --fail-fast
        spack load sloth
        cmake -S $(spack location -i sloth)/share/sloth/examples/minimal \
              -B ${{ github.workspace }}/spack-example-build
        cmake --build ${{ github.workspace }}/spack-example-build
        cd ${{ github.workspace }}/spack-example-build && ctest --output-on-failure

    - name: Save Tests on Failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-linux
        path: ${{ github.workspace }}/build/tests
        retention-days: 1

  build-MacOS:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set number of cores
      run: echo "CORES=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

    - name: Install MFEM
      run: brew install mfem

    - name: Install Voro++ (for test)
      run: brew install voro++

    - name: Setup Python 
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Python dependencies 
      run: python -m pip install --upgrade pip gcovr cpplint matplotlib pandas numpy scipy sympy vtk

    - name: Build SLOTH 
      run: | 
        mkdir -p ${{ github.workspace }}/build
        cd ${{ github.workspace }}/build
        bash ../envSloth.sh --coverage --voro=$(brew --prefix voro++)
        make -j $CORES tests

    - name: Test SLOTH 
      run: | 
        cd ${{ github.workspace }}/build
        find . -type d -name "Save*" -exec rm -rf {} +
        ctest -j $CORES --output-on-failure

    - name: Install SLOTH and build the minimal example (user procedure)
      run: |
        cd ${{ github.workspace }}/build
        cmake --install . --prefix ${{ github.workspace }}/sloth-installed
        cmake -S ${{ github.workspace }}/sloth-installed/share/sloth/examples/minimal \
              -B ${{ github.workspace }}/example-build \
              -DCMAKE_PREFIX_PATH=${{ github.workspace }}/sloth-installed
        cmake --build ${{ github.workspace }}/example-build
        cd ${{ github.workspace }}/example-build && ctest --output-on-failure

    - name: Save Tests on Failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-macos
        path: ${{ github.workspace }}/build/tests
        retention-days: 1

    - name: Code Coverage Analysis 
      if: ${{ always() }}
      run: | 
        cd ${{ github.workspace }}/build
        make cc

    - name: Save Code Coverage Analysis
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: ${{ github.workspace }}/build/Coverage
        retention-days: 1
  
    - name: CppLint
      if: ${{ always() }}
      continue-on-error: true
      run: | 
        cd ${{ github.workspace }}/build
        cpplint \
        --filter=-runtime/references,-build/header_guard,-runtime/string,-build/include \
        --counting=total \
        --extensions=cpp,cxx,hpp,h,hxx,tpp \
        --linelength=100 \
        --recursive ../kernel ../tests